<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Cover image, square</title>
<link rel="stylesheet" href="../gm.css">
<style>body { background: #e5e7eb; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 0; }</style>
</head>
<body>
<!-- COVER IMAGE for a post or an article, square 1200x1200 (feed, blog index).
     Landscape 1200x627 version: cover-landscape.html.
       scripts/shoot.sh cover.html cover.png 1200 1200
     The recipe never changes: steel viewport with grain, the title in white,
     regular weight, centred, at most three lines, and ONE white line diagram
     underneath. No photo, no gradient, no icon set, no logo wall. -->

<!-- square 1200x1200: LinkedIn feed, blog index -->
<div class="gm-viewport gm-cover" id="square">
  <p class="gm-viewport__title">Inside a reading desk that runs itself</p>
  <svg width="560" height="130" viewBox="0 0 560 130" aria-hidden="true">
    <rect class="gm-wire" x="2" y="16" width="144" height="98" rx="12" style="stroke-width:2.5"/>
    <rect class="gm-wire" x="414" y="16" width="144" height="98" rx="12" style="stroke-width:2.5"/>
    <path class="gm-wire gm-wire--dotted" style="stroke-width:3;stroke-dasharray:1 11" d="M158 46 C200 26, 232 34, 252 54M158 84 C200 104, 232 96, 252 76M402 46 C360 26, 328 34, 308 54M402 84 C360 104, 328 96, 308 76"/>
    <circle cx="280" cy="65" r="32" fill="#fff"/><rect x="267" y="52" width="26" height="26" rx="7" fill="#030712"/>
  </svg>
</div>

</body>
</html>
